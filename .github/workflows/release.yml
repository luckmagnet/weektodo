name: Build/release Electron app

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: |
          npm install --global yarn
          yarn --version
          yarn install --frozen-lockfile

      - name: Install Linux / Windows build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends wine64 wine32 wine-stable
          sudo apt-get install -y --no-install-recommends nsis unzip zip
          sudo apt-get install -y --no-install-recommends mono-runtime

      - name: Show makensis version (debug)
        run: |
          which makensis || true
          makensis -VERSION || true

      - name: Build Windows installers (publish to GitHub)
        run: |
          DEBUG=electron-builder yarn run electron:build --win nsis --x64 --ia32 --publish=always

      - name: List dist contents (debug)
        run: |
          ls -la dist || true
          find dist -maxdepth 4 -type f -print || true

      # Optional: create a draft release and attach any artifacts (fallback)
      - name: Create draft GitHub Release and attach builds (optional)
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          name: Build ${{ github.run_number }}
          tag_name: build-${{ github.run_id }}
          files: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
