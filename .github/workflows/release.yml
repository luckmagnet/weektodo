name: Build/release Electron app

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: |
          npm install --global yarn
          yarn --version
          yarn install --frozen-lockfile

      - name: Install Linux / Windows build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends wine64 wine32 wine-stable
          sudo apt-get install -y --no-install-recommends nsis unzip zip
          sudo apt-get install -y --no-install-recommends mono-runtime

      - name: Show makensis version (debug)
        run: |
          which makensis || true
          makensis -VERSION || true

      - name: Build Windows installers (do not publish from builder)
        run: |
          DEBUG=electron-builder yarn run electron:build --win nsis --x64 --ia32 --publish=never

      - name: Aggregate possible output folders and list contents
        run: |
          # Common output folders to check
          CANDIDATES="dist dist_electron out release build"
          FOUND=0
          for d in $CANDIDATES; do
            if [ -d "$d" ]; then
              echo "Contents of $d:"
              find "$d" -maxdepth 4 -type f -print || true
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No candidate output folders found." >&2
          fi
          # Print dist specifically for earlier logs
          ls -la dist || true

      - name: Find any installer/artifact
        id: find_installer
        run: |
          FILE=$(find dist dist_electron out release build -type f \( -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.dmg' -o -iname '*.deb' \) -print -quit || true)
          if [ -z "$FILE" ]; then
            echo "no_installer=true" >> $GITHUB_OUTPUT
            echo "::error ::No installer artifact found in dist/dist_electron/out/release/build"
            exit 1
          else
            echo "installer=$FILE" >> $GITHUB_OUTPUT
            echo "Found installer: $FILE"
          fi

      - name: Create draft GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          name: Build ${{ github.run_number }}
          tag_name: build-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_installer.outputs.installer }}
          asset_name: ${{ steps.find_installer.outputs.installer }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all build artifacts to workflow (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-build-files
          path: |
            dist/**/*
            dist_electron/**/*
            out/**/*
            release/**/*
            build/**/*
